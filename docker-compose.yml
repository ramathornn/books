services:
  postgres:
    image: postgres:16-alpine
    container_name: books-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: books
      POSTGRES_PASSWORD: books
      POSTGRES_DB: books
    ports:
      - "5432:5432"
    volumes:
      - books-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U books -d books"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: books-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - books-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  books-postgres:
  books-redis:
